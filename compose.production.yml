services:
  app:
    build:
      context: .
      dockerfile: dockerfile.production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:?Configure TRUST_PROXY to the private Docker gateway address}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: controle_financeiro
      DB_USER: financeiro_app
      DB_PASSWORD: ${DB_PASSWORD:?Set a dedicated database password}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set a Redis password}@redis:6379
      REFRESH_COOKIE_PATH: /api/auth
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - private

  database:
    image: mysql:9.7.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: controle_financeiro
      MYSQL_USER: financeiro_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a dedicated database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate MySQL root password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a Redis password}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

volumes:
  mysql_data:

networks:
  private:
    driver: bridge
    ipam:
      config:
        # Change this subnet if it overlaps with the VPS network.
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
