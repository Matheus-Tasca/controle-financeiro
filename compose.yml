services:
  app:
    container_name: 'app'
    build: .
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:8080:8080'
    restart: always
    env_file:
      - .env.dev
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-controle_financeiro}
      DB_USER: root
      REDIS_URL: redis://redis:6379
      REFRESH_COOKIE_PATH: /api/auth

  frontend:
    container_name: frontend
    env_file:
      - .env.dev
    build:
      context: .
      dockerfile: dockerfile.frontend
    ports:
      - '127.0.0.1:8087:80'
    restart: always
    depends_on:
      - app

  database:
    container_name: 'database'
    image: 'mysql:9.7.0'
    env_file:
      - .env.dev
    environment:
      MYSQL_DATABASE: ${DB_NAME:-controle_financeiro}
    ports:
      - '127.0.0.1:3306:3306'
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10
      start_period: 5s

  redis:
    container_name: 'redis'
    image: 'redis:7-alpine'
    ports:
      - '127.0.0.1:6379:6379'
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  mysql_data:
