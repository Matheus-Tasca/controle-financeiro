<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle Financeiro - Cadastrar Transação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="cadastrar_transacao" class="bg-gray-900 text-gray-100 font-sans antialiased h-screen flex overflow-hidden">
    <aside class="w-64 bg-gray-800 border-r border-gray-700 hidden md:flex flex-col">
      <div class="p-8 pb-4"><h2 class="text-2xl font-bold text-green-400">FinanceApp</h2></div>
      <div id="navbar-placeholder"></div>
    </aside>

    <div class="md:hidden absolute top-0 left-0 w-full bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center z-10">
      <h2 class="text-xl font-bold text-green-400">FinanceApp</h2>
      <button id="mobile-menu-btn" class="text-gray-300 hover:text-white" aria-label="Abrir menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>

    <main class="flex-1 h-full relative pt-16 md:pt-0 overflow-y-auto">
      <div class="p-6 md:p-10 max-w-4xl mx-auto w-full">
        <header class="mb-8 text-center"><h1 class="text-2xl md:text-3xl font-medium">Cadastrar transação</h1><p class="text-gray-400 mt-2">Registre uma entrada ou saída e, se necessário, divida em parcelas.</p></header>

        <section class="border border-gray-700 rounded-lg bg-gray-900 p-5 md:p-8">
          <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-2 gap-5" novalidate>
            <div class="md:col-span-2">
              <label for="description" class="block text-sm text-gray-300 mb-1">Descrição <span class="text-gray-500">(opcional)</span></label>
              <input id="description" name="description" type="text" maxlength="200" placeholder="Ex.: Compra no supermercado" class="w-full px-3 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-green-400" />
            </div>

            <div>
              <label for="transaction-type" class="block text-sm text-gray-300 mb-1">Tipo</label>
              <select id="transaction-type" name="transactionType" required class="form-control">
                <option value="saida">Saída</option>
                <option value="entrada">Entrada</option>
              </select>
            </div>
            <div>
              <label for="date" class="block text-sm text-gray-300 mb-1">Data</label>
              <input id="date" name="date" type="date" lang="pt-BR" required class="form-control" />
            </div>

            <div>
              <label for="category-id" class="block text-sm text-gray-300 mb-1">Categoria</label>
              <select id="category-id" name="categoryId" required class="form-control">
                <option value="">Carregando categorias...</option>
              </select>
              <p id="category-load-error" class="mt-1 text-xs text-red-400 hidden"></p>
            </div>
            <div>
              <label for="payment-method-id" class="block text-sm text-gray-300 mb-1">Forma de pagamento</label>
              <select id="payment-method-id" name="paymentMethodId" required class="form-control">
                <option value="">Carregando formas de pagamento...</option>
              </select>
              <p id="payment-method-load-error" class="mt-1 text-xs text-red-400 hidden"></p>
            </div>

            <div>
              <label for="amount" class="block text-sm text-gray-300 mb-1">Valor total</label>
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">R$</span>
                <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" required placeholder="0,00" class="form-control pl-11" aria-describedby="amount-help" />
              </div>
              <p id="amount-help" class="mt-1 text-xs text-gray-500">Use vírgula para os centavos. Ex.: 125,90.</p>
            </div>

            <div id="card-field" class="hidden">
              <label for="card-id" class="block text-sm text-gray-300 mb-1">Cartão</label>
              <select id="card-id" name="cardId" class="form-control">
                <option value="">Carregando cartões...</option>
              </select>
              <p id="card-load-error" class="mt-1 text-xs text-red-400 hidden"></p>
            </div>

            <div id="installments-field" class="hidden md:col-span-2">
              <label for="total-installments" class="block text-sm text-gray-300 mb-1">Parcelas</label>
              <input id="total-installments" name="totalInstallments" type="number" inputmode="numeric" min="1" step="1" value="1" required class="form-control max-w-xs" />
              <p id="installment-preview" class="mt-2 text-sm text-gray-400" aria-live="polite"></p>
            </div>

            <p id="form-error" class="md:col-span-2 text-sm text-red-400 hidden" role="alert"></p>
            <div class="md:col-span-2 flex justify-center pt-2">
              <button id="submit-button" type="submit" class="px-6 py-2.5 bg-green-500 hover:bg-green-600 text-gray-900 text-sm font-semibold rounded-lg transition disabled:opacity-50">Salvar transação</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 z-[60] hidden px-4 py-3 rounded-lg shadow-lg text-sm font-medium" role="status" aria-live="polite"></div>
    <div id="mobile-navbar-placeholder"></div>
    <script src="../components/auth.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/date-utils.js"></script>
    <script src="script.js"></script>
  </body>
</html>
